<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FileDrop – رفع الملفات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0f14;
      --surface: #161a23;
      --surface2: #1e2433;
      --accent: #4f8ef7;
      --accent2: #7c5cfc;
      --green: #34d399;
      --red: #f87171;
      --text: #e8eaf0;
      --muted: #6b7280;
      --border: rgba(255,255,255,0.07);
      --glow: 0 0 40px rgba(79,142,247,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(79,142,247,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(124,92,252,0.08) 0%, transparent 60%);
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header .logo {
      font-size: 2.6rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }

    header p {
      color: var(--muted);
      margin-top: 8px;
      font-size: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
      box-shadow: var(--glow);
    }

    /* ── Drop zone ── */
    .dropzone {
      border: 2px dashed rgba(79,142,247,0.3);
      border-radius: 14px;
      padding: 52px 24px;
      text-align: center;
      cursor: pointer;
      transition: all .25s ease;
      background: rgba(79,142,247,0.03);
      position: relative;
    }
    .dropzone:hover, .dropzone.drag-over {
      border-color: var(--accent);
      background: rgba(79,142,247,0.07);
      box-shadow: 0 0 24px rgba(79,142,247,0.1);
    }

    .dropzone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }

    .dropzone .icon {
      font-size: 3rem;
      margin-bottom: 16px;
      display: block;
    }

    .dropzone h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .dropzone p {
      color: var(--muted);
      font-size: .9rem;
    }

    /* ── File preview ── */
    #file-preview {
      display: none;
      align-items: center;
      gap: 14px;
      margin-top: 20px;
      padding: 14px 16px;
      background: var(--surface2);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    #file-preview .file-icon { font-size: 2rem; }
    #file-preview .file-info { flex: 1; min-width: 0; }
    #file-preview .file-name {
      font-weight: 600;
      font-size: .95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #file-preview .file-size {
      color: var(--muted);
      font-size: .82rem;
      margin-top: 2px;
    }
    #file-preview .remove-btn {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 1.3rem;
      transition: color .2s;
    }
    #file-preview .remove-btn:hover { color: var(--red); }

    /* ── Upload button ── */
    #upload-btn {
      display: none;
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
    }
    #upload-btn:hover { opacity: .92; transform: translateY(-1px); }
    #upload-btn:active { transform: translateY(0); }
    #upload-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Progress ── */
    #progress-wrap {
      display: none;
      margin-top: 18px;
    }
    .progress-bar-bg {
      height: 8px;
      background: var(--surface2);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 0%;
      transition: width .2s ease;
      border-radius: 99px;
    }
    .progress-label {
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
      margin-top: 8px;
    }

    /* ── Result ── */
    #result {
      display: none;
      margin-top: 24px;
    }

    .result-box {
      background: rgba(52,211,153,0.07);
      border: 1px solid rgba(52,211,153,0.25);
      border-radius: 14px;
      padding: 20px;
    }

    .result-box .success-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--green);
      font-size: 1rem;
      margin-bottom: 14px;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .link-row input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-family: monospace;
      font-size: .85rem;
      outline: none;
      min-width: 0;
    }

    .copy-btn, .dl-btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      font-size: .85rem;
      white-space: nowrap;
      transition: opacity .2s;
    }
    .copy-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .copy-btn:hover { opacity: .8; }
    .dl-btn {
      background: var(--green);
      color: #0d1a13;
    }
    .dl-btn:hover { opacity: .85; }

    /* ── Error ── */
    #error-msg {
      display: none;
      margin-top: 18px;
      padding: 14px 18px;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.25);
      border-radius: 12px;
      color: var(--red);
      font-size: .9rem;
    }

    /* ── Upload another ── */
    #new-upload-btn {
      display: none;
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: 'Cairo', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    #new-upload-btn:hover { background: var(--surface); }

    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: .82rem;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">📦 FileDrop</div>
  <p>Upload any file, get a direct download link</p>
</header>

<div class="card">

  <!-- Drop Zone -->
  <div class="dropzone" id="dropzone">
    <input type="file" id="file-input" />
    <span class="icon">☁️</span>
    <h3>Drag the file here or click to select</h3>
    <p>All file types are supported · Maximum 100 MB</p>
  </div>

  <!-- File preview -->
  <div id="file-preview">
    <span class="file-icon" id="file-icon">📄</span>
    <div class="file-info">
      <div class="file-name" id="file-name"></div>
      <div class="file-size" id="file-size"></div>
    </div>
    <button class="remove-btn" id="remove-btn" title="Remove">✕</button>
  </div>

  <!-- Upload button -->
  <button id="upload-btn">⬆️ Upload file</button>

  <!-- Progress -->
  <div id="progress-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
    <div class="progress-label" id="progress-label">Uploading in progress...</div>
  </div>

  <!-- Error -->
  <div id="error-msg"></div>

  <!-- Result -->
  <div id="result">
    <div class="result-box">
      <div class="success-title">✅ Uploaded successfully!</div>
      <div class="link-row">
        <input type="text" id="result-link" readonly />
        <button class="copy-btn" id="copy-btn">Copy</button>
        <a id="dl-link" href="#" class="dl-btn">⬇️ Download</a>
      </div>
    </div>
  </div>

  <!-- Upload another -->
  <button id="new-upload-btn">+ Upload another file</button>

</div>

<footer>
 Developer : @mrigax55/
</footer>

<script>
  const dropzone    = document.getElementById('dropzone');
  const fileInput   = document.getElementById('file-input');
  const filePreview = document.getElementById('file-preview');
  const fileIcon    = document.getElementById('file-icon');
  const fileName    = document.getElementById('file-name');
  const fileSize    = document.getElementById('file-size');
  const removeBtn   = document.getElementById('remove-btn');
  const uploadBtn   = document.getElementById('upload-btn');
  const progressWrap= document.getElementById('progress-wrap');
  const progressFill= document.getElementById('progress-fill');
  const progressLbl = document.getElementById('progress-label');
  const errorMsg    = document.getElementById('error-msg');
  const resultDiv   = document.getElementById('result');
  const resultLink  = document.getElementById('result-link');
  const copyBtn     = document.getElementById('copy-btn');
  const dlLink      = document.getElementById('dl-link');
  const newUploadBtn= document.getElementById('new-upload-btn');

  let selectedFile = null;

  const ICONS = {
    image: '🖼️', pdf: '📕', video: '🎬', audio: '🎵',
    zip: '🗜️', word: '📝', excel: '📊', default: '📄'
  };

  function getIcon(file) {
    const t = file.type;
    if (t.startsWith('image/')) return ICONS.image;
    if (t === 'application/pdf') return ICONS.pdf;
    if (t.startsWith('video/')) return ICONS.video;
    if (t.startsWith('audio/')) return ICONS.audio;
    if (t.includes('zip') || t.includes('rar')) return ICONS.zip;
    if (t.includes('word')) return ICONS.word;
    if (t.includes('excel') || t.includes('sheet')) return ICONS.excel;
    return ICONS.default;
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  function setFile(file) {
    selectedFile = file;
    fileIcon.textContent = getIcon(file);
    fileName.textContent = file.name;
    fileSize.textContent = formatSize(file.size);
    filePreview.style.display = 'flex';
    uploadBtn.style.display = 'block';
    hideError();
  }

  function reset() {
    selectedFile = null;
    fileInput.value = '';
    filePreview.style.display = 'none';
    uploadBtn.style.display = 'none';
    progressWrap.style.display = 'none';
    progressFill.style.width = '0%';
    resultDiv.style.display = 'none';
    newUploadBtn.style.display = 'none';
    dropzone.style.display = '';
    hideError();
  }

  function hideError() {
    errorMsg.style.display = 'none';
    errorMsg.textContent = '';
  }

  // Drag events
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
  });

  removeBtn.addEventListener('click', reset);

  newUploadBtn.addEventListener('click', reset);

  uploadBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    uploadBtn.disabled = true;
    progressWrap.style.display = 'block';
    hideError();

    const formData = new FormData();
    formData.append('file', selectedFile);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload');

    xhr.upload.addEventListener('progress', e => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        progressFill.style.width = pct + '%';
        progressLbl.textContent = `Uploading... ${pct}%`;
      }
    });

    xhr.addEventListener('load', () => {
      uploadBtn.disabled = false;
      if (xhr.status === 200) {
        const data = JSON.parse(xhr.responseText);
        progressLbl.textContent = 'Done! ✓';
        progressFill.style.width = '100%';
        resultLink.value = data.link;
        dlLink.href = data.link;
        resultDiv.style.display = 'block';
        newUploadBtn.style.display = 'block';
      } else {
        showError('Upload failed. Make sure the server is running.');
        progressWrap.style.display = 'none';
      }
    });

    xhr.addEventListener('error', () => {
      uploadBtn.disabled = false;
      progressWrap.style.display = 'none';
      showError('Cannot connect to the server. Run server.js first.');
    });

    xhr.send(formData);
  });

  function showError(msg) {
    errorMsg.textContent = '⚠️ ' + msg;
    errorMsg.style.display = 'block';
  }

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(resultLink.value).then(() => {
      copyBtn.textContent = '✓ Copied';
      setTimeout(() => copyBtn.textContent = 'Copy', 2000);
    });
  });
</script>
</body>
</html>
